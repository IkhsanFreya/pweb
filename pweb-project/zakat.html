<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Zakat - ZakatKu</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="zakat-calc.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Include your navbar here -->

    <!-- Add this after the navbar and before zakat-container -->
    <div class="back-button">
        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i>
            Kembali ke Beranda
        </a>
    </div>

    <div class="zakat-container">
        <!-- Update the tab navigation -->
        <div class="tab-navigation">
            <a href="zakat.html" class="tab-item active">
                <i class="fas fa-hand-holding-heart"></i>
                Zakat
            </a>
            <a href="infak.html" class="tab-item">
                <i class="fas fa-gift"></i>
                Infak
            </a>
            <a href="wakaf.html" class="tab-item">
                <i class="fas fa-mosque"></i>
                Wakaf
            </a>
        </div>

        <div class="quote-card">
            <div class="quote-text">
                <p>"Orang yang berzakat menjadikan hartanya menjadi suci bersih."</p>
                <p class="quote-author">(Prof. Dr. Quraish Shihab)</p>
            </div>
            <div class="quote-image">
                <img src="img/zakat.png" alt="Decoration" class="floating">
            </div>
        </div>

        <div class="calculator-section">
            <div class="calc-header">
                <img src="img/infaq.png" alt="Calculator" class="calc-icon">
                <h2>Ayo hitung zakat kamu!</h2>
            </div>

            <!-- Update the select options in zakat-type -->
            <div class="zakat-type">
                <select id="zakatType">
                    <option value="mal">Zakat Maal</option>
                    <option value="profesi">Zakat Profesi</option>
                    <option value="berdaya">NU Care Berdaya</option>
                    <option value="logam">Zakat Emas, Perak, dan Logam Mulia</option>
                    <option value="fitrah">Zakat Fitrah</option>
                    <option value="jasa">Zakat Pendapatan Dan Jasa</option>
                    <option value="perniagaan">Zakat Perniagaan</option>
                    <option value="tambang">Zakat Pertambangan</option>
                    <option value="pertanian">Zakat Pertanian, Perkebunan, dan Kehutanan</option>
                    <option value="perusahaan">Zakat Perusahaan</option>
                    <option value="peternakan">Zakat Peternakan dan Perikanan</option>
                    <option value="rikaz">Zakat Rikaz</option>
                    <option value="surat-berharga">Zakat Uang dan Surat Berharga</option>
                </select>
            </div>

            <div class="calc-instruction">
                <p>Coba masukkan jumlah hartamu dan kalkulator kami akan menghitung jumlah zakatnya.</p>
            </div>

            <div class="input-section">
                <label>Kekayaan (1 tahun)</label>
                <div class="amount-input">
                    <span class="currency">Rp</span>
                    <input type="number" id="wealthAmount" placeholder="0">
                </div>
            </div>

            <div class="custom-toggle">
                <label class="toggle">
                    <input type="checkbox" id="customZakat">
                    <span class="toggle-slider"></span>
                </label>
                <span>Isi sendiri Zakat Maal</span>
            </div>

            <div class="result-section">
                <h3>Zakat Maal Kamu</h3>
                <p class="result-amount">Rp 0</p>
            </div>

            <button class="pay-zakat-btn">Bayar Zakat</button>
        </div>
    </div>

    <script src="zakat-calc.js"></script>
</body>
</html>
