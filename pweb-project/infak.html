<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infak - ZakatKu</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="zakat-calc.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Add this after the navbar and before zakat-container -->
    <div class="back-button">
        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i>
            Kembali ke Beranda
        </a>
    </div>
    <div class="zakat-container">
        <div class="tab-navigation">
            <a href="zakat.html" class="tab-item">
                <i class="fas fa-hand-holding-heart"></i>
                Zakat
            </a>
            <a href="infak.html" class="tab-item active">
                <i class="fas fa-gift"></i>
                Infak
            </a>
            <a href="wakaf.html" class="tab-item">
                <i class="fas fa-mosque"></i>
                Wakaf
            </a>
        </div>

        <div class="quote-card">
            <div class="quote-text">
                <p>"Apa yang kita makan habis, apa yang kita simpan belum tentu kita nikmati. Apa yang kita infakkan justru menjadi rezeki yang kita perlukan kelak."</p>
                <p class="quote-author">(KH. Ahmad Mustofa Bisri)</p>
            </div>
            <div class="quote-image">
                <img src="img/infaq1.png" alt="Decoration" class="floating">
            </div>
        </div>

        <div class="calculator-section">
            <div class="calc-header">
                <img src="img/infaq.png" alt="Infak" class="calc-icon">
                <h2>Ayo mulai infak!</h2>
            </div>

            <div class="zakat-type">
                <select id="zakatType">
                    <option value="">Hari Santri</option>
                </select>
            </div>

            <div class="calc-instruction">
                <p>Silakan isi jumlah infakmu. Insya Allah berkah.</p>
            </div>

            <div class="input-section">
                <label>Nominal Infak</label>
                <div class="amount-input">
                    <span class="currency">Rp</span>
                    <input type="number" id="infakAmount" placeholder="10000" value="10000">
                </div>
            </div>

            <button class="pay-zakat-btn">Infak sekarang</button>
        </div>
    </div>

    <script src="zakat-calc.js"></script>
</body>
</html>
